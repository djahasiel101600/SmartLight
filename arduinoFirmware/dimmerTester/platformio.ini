; =============================================================================
; PlatformIO Project Configuration
; RobotDyn Dimmer Range Tester — Arduino UNO R3
;
; Purpose:
;   Sweep through every setPower(0-99) value so you can observe the bulb
;   and annotate which values are dead zones, flicker, or work correctly.
;   Results are printed to the serial monitor ready to be copy-pasted and
;   labeled in the RESULTS section at the top of src/main.cpp.
;
; Commands:
;   pio run -t upload -e uno           — build and upload
;   pio device monitor -e uno          — open serial monitor
;   pio run -t upload -e uno && pio device monitor -e uno  — upload then watch
; =============================================================================

[env:uno]
platform  = atmelavr
board     = uno
framework = arduino

; Windows: change to the COMx port shown in Device Manager
; Linux/Pi: typically /dev/ttyACM0 or /dev/ttyUSB0
upload_port   = /dev/ttyACM0
monitor_speed = 9600
monitor_port  = ${env:uno.upload_port}

lib_deps =
    ingelobito/RBDdimmer@^1.0

build_flags =
    -DARDUINO_AVR_UNO
