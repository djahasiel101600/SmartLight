; =============================================================================
; PlatformIO Project Configuration
; RobotDyn 2-Channel AC Light Dimmer — Arduino UNO R3
;
; Common commands:
;   pio run                  — build only
;   pio run --target upload  — build and upload
;   pio device monitor       — open serial monitor (Ctrl+C to exit)
;   pio run -t upload && pio device monitor   — upload then monitor
; =============================================================================

[env:uno]
platform  = atmelavr
board     = uno
framework = arduino

; ---- Upload settings --------------------------------------------------------
; Windows: change to the COMx port shown in Device Manager
; Linux/Pi: typically /dev/ttyACM0 or /dev/ttyUSB0
upload_port = COM3

; ---- Serial monitor ---------------------------------------------------------
monitor_speed = 9600
monitor_port  = ${env:uno.upload_port}

; ---- Dependencies -----------------------------------------------------------
; RBDimmer by RobotDyn — zero-crossing synchronized AC dimmer library
; PlatformIO registry: https://registry.platformio.org/libraries/robotdyn/RBDimmer
lib_deps =
    robotdyn/RBDimmer @ ^1.0.0

; ---- Build flags ------------------------------------------------------------
build_flags =
    -DARDUINO_AVR_UNO
